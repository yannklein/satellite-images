<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>METEOR-M2 passes — yannklein.dev</title>
  <!--
    Gallery frontend for the METEOR-M2 ground station.
    Reads passes.json (built by rebuild-passes.sh) and renders each pass,
    plus a Barcelona-centered timelapse and a "next passes" panel.
    BEFORE USE: replace the two `https://n8n.YOUR_DOMAIN` webhook base URLs
    below with your own n8n instance (see the /next-passes and /satdump-status
    fetch calls). NtoS passes are display-flipped with CSS transform:scale(-1,-1).
  -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%B0%EF%B8%8F%3C/text%3E%3C/svg%3E"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #080c10;
      --surface: #0d1117;
      --card: #111820;
      --border: rgba(255,255,255,0.07);
      --accent: #00e5a0;
      --accent2: #0088ff;
      --text: #e8edf2;
      --muted: #5a6878;
      --mono: 'Space Mono', monospace;
      --sans: 'DM Sans', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
    header { position: relative; z-index: 1; padding: 3rem 2rem 2rem; border-bottom: 0.5px solid var(--border); display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .header-left h1 { font-family: var(--mono); font-size: clamp(18px, 3vw, 28px); font-weight: 700; letter-spacing: -0.02em; color: var(--text); margin-bottom: 4px; }
    .header-left h1 span { color: var(--accent); }
    .header-left p { font-size: 13px; color: var(--muted); font-family: var(--mono); }
    .live-dot { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; color: #f59e0b; border: 0.5px solid #f59e0b; padding: 4px 10px; border-radius: 99px; }
    .live-dot::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #f59e0b; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    main { position: relative; z-index: 1; padding: 2rem; max-width: 1200px; margin: 0 auto; }
    .pass { margin-bottom: 3rem; animation: fadeUp 0.5s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .pass-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 0.5px solid var(--border); }
    .pass-number { font-family: var(--mono); font-size: 11px; color: var(--accent2); background: rgba(0,136,255,0.1); border: 0.5px solid rgba(0,136,255,0.3); padding: 3px 8px; border-radius: 4px; }
    .pass-date { font-family: var(--mono); font-size: 13px; color: var(--text); }
    .pass-meta { font-size: 12px; color: var(--muted); margin-left: auto; font-family: var(--mono); }
    .pass-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .thumb { position: relative; border-radius: 8px; overflow: hidden; border: 0.5px solid var(--border); cursor: pointer; background: var(--card); aspect-ratio: 16/9; transition: border-color 0.2s, transform 0.2s; }
    .thumb:hover { border-color: var(--accent); transform: translateY(-2px); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity 0.3s; }
    .thumb-label { position: absolute; bottom: 0; left: 0; right: 0; padding: 6px 10px; background: linear-gradient(transparent, rgba(0,0,0,0.8)); font-family: var(--mono); font-size: 10px; color: rgba(255,255,255,0.7); }
    .thumb-overlay { position: absolute; inset: 0; background: rgba(0,229,160,0.05); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
    .thumb:hover .thumb-overlay { opacity: 1; }
    .thumb-overlay svg { width: 32px; height: 32px; stroke: var(--accent); fill: none; stroke-width: 1.5; }
    .thumb-flip-badge { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.6); color: rgba(255,255,255,0.5); font-family: var(--mono); font-size: 10px; padding: 2px 7px; border-radius: 4px; pointer-events: none; z-index: 2; }
    .failed-accordion { margin-bottom: 3rem; border: 0.5px solid var(--border); border-radius: 8px; overflow: hidden; animation: fadeUp 0.5s ease both; }
    .failed-accordion summary { list-style: none; cursor: pointer; padding: 0.9rem 1.2rem; display: flex; align-items: center; gap: 0.75rem; font-family: var(--mono); font-size: 12px; color: var(--muted); user-select: none; transition: background 0.15s; }
    .failed-accordion summary::-webkit-details-marker { display: none; }
    .failed-accordion summary:hover { background: rgba(255,255,255,0.02); }
    .failed-accordion summary .chevron { width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 2; transition: transform 0.2s; flex-shrink: 0; }
    .failed-accordion[open] summary .chevron { transform: rotate(90deg); }
    .failed-accordion summary .count-badge { font-size: 11px; color: var(--accent2); background: rgba(0,136,255,0.1); border: 0.5px solid rgba(0,136,255,0.3); padding: 2px 8px; border-radius: 4px; }
    .failed-accordion .failed-list { border-top: 0.5px solid var(--border); padding: 0.5rem 1.2rem 1rem; }
    .failed-row { display: flex; align-items: center; gap: 1rem; padding: 0.5rem 0; font-family: var(--mono); font-size: 12px; border-bottom: 0.5px solid var(--border); }
    .failed-row:last-child { border-bottom: none; }
    .lightbox { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s; backdrop-filter: blur(8px); }
    .lightbox.open { opacity: 1; pointer-events: all; }
    .lightbox-inner { position: relative; max-width: 90vw; max-height: 90vh; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .lightbox img { height: 80vh; width: auto; max-width: 90vw; object-fit: contain; border-radius: 4px; border: 0.5px solid var(--border); transition: transform 0.2s; }
    .lightbox-meta { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: center; }
    .lightbox-meta span { color: var(--accent); }
    .lightbox-close { position: absolute; top: -40px; right: 0; background: none; border: 0.5px solid var(--border); color: var(--muted); font-family: var(--mono); font-size: 12px; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
    .lightbox-nav { display: flex; gap: 8px; margin-top: 4px; }
    .lightbox-nav button { background: var(--card); border: 0.5px solid var(--border); color: var(--text); font-family: var(--mono); font-size: 12px; padding: 6px 14px; border-radius: 4px; cursor: pointer; }
    .lightbox-nav button:disabled { opacity: 0.3; cursor: not-allowed; }
    footer { position: relative; z-index: 1; padding: 2rem; border-top: 0.5px solid var(--border); font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: center; }
    .pass-card{background:var(--card);border:0.5px solid var(--border);border-radius:8px;padding:14px 16px}
    .pass-card-date{font-family:var(--mono);font-size:11px;color:var(--accent);margin-bottom:4px}
    .pass-card-time{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--text);margin-bottom:8px}
    .pass-card-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-family:var(--mono);margin-bottom:3px}
    .pass-card-row span:last-child{color:var(--text)}
    .pass-card-el{display:inline-block;margin-top:8px;font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:4px}
    .pass-card-el.high{background:rgba(0,229,160,0.15);border:0.5px solid var(--accent);color:var(--accent)}
    .pass-card-el.med{background:rgba(0,136,255,0.1);border:0.5px solid var(--accent2);color:var(--accent2)}
    .pass-card-el.low{background:rgba(255,255,255,0.04);border:0.5px solid var(--muted);color:var(--muted)}
    .countdown{font-family:var(--mono);font-size:11px;color:var(--accent);margin-top:6px}
    .pass-card.skipped-night{opacity:0.55}
    .pass-card-night-badge{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:4px}
    .tl-modal { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.93); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; backdrop-filter: blur(6px); }
    .tl-modal.open { opacity: 1; pointer-events: all; }
    .tl-panel { display: flex; flex-direction: column; width: 92vw; max-width: 1100px; height: 88vh; background: var(--surface); border: 0.5px solid var(--border); border-radius: 10px; overflow: hidden; }
    .tl-topbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
    .tl-topbar-left { font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .tl-topbar-left strong { color: var(--accent); font-weight: 700; }
    .tl-close-btn { font-family: var(--mono); font-size: 11px; background: none; border: 0.5px solid var(--border); color: var(--muted); padding: 3px 10px; border-radius: 4px; cursor: pointer; }
    .tl-viewport { flex: 1; position: relative; overflow: hidden; background: #000; }
    .tl-viewport img { position: absolute; display: block; }
    .tl-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 14px; border-top: 0.5px solid var(--border); background: var(--card); flex-shrink: 0; }
    .tl-btn { font-family: var(--mono); font-size: 13px; background: none; border: 0.5px solid var(--border); color: var(--text); width: 32px; height: 32px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .tl-progress-wrap { flex: 1; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; cursor: pointer; position: relative; min-width: 60px; }
    .tl-progress-bar { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; }
    .tl-ctrl-label { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 5px; }
    .tl-ctrl-label input[type=range] { width: 70px; vertical-align: middle; }
  </style>
</head>
<body>
<header>
  <div class="header-left">
    <h1>METEOR-M2 <span>//</span> satellite passes</h1>
    <p>137.900 MHz · Barcelona 41.38°N 2.17°E · RTL-SDR V3</p>
  </div>
  <div class="live-dot" id="sat-status-badge">not recording</div>
</header>

<div style="position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:1.5rem 2rem 0">
  <div style="font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px">next 3 passes over Barcelona</div>
  <div id="next-passes-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:2rem">
    <div style="font-family:var(--mono);font-size:12px;color:var(--muted)">fetching pass predictions...</div>
  </div>
</div>

<div style="position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 2rem 1.5rem;display:flex;align-items:center;gap:12px">
  <button onclick="openTimelapse()" style="font-family:var(--mono);font-size:12px;background:rgba(0,229,160,0.08);border:0.5px solid var(--accent);color:var(--accent);padding:7px 16px;border-radius:4px;cursor:pointer">▶ timelapse</button>
  <span style="font-family:var(--mono);font-size:11px;color:var(--muted)">watch Earth's surface change over time</span>
</div>

<main id="gallery"></main>

<div class="tl-modal" id="tl-modal">
  <div class="tl-panel">
    <div class="tl-topbar">
      <div class="tl-topbar-left">timelapse &nbsp;·&nbsp; <strong id="tl-ts">—</strong><span id="tl-counter" style="color:var(--muted);margin-left:8px"></span></div>
      <div style="display:flex;align-items:center;gap:10px">
        <label class="tl-ctrl-label"><input type="checkbox" id="tl-center-bcn" checked onchange="tlRenderFrame()"> center BCN</label>
        <button class="tl-close-btn" onclick="closeTimelapse()">× close</button>
      </div>
    </div>
    <div class="tl-viewport" id="tl-viewport"><img id="tl-img" src="" alt=""/></div>
    <div class="tl-controls">
      <button class="tl-btn" id="tl-pp" onclick="tlToggle()">⏸</button>
      <button class="tl-btn" onclick="tlStep(-1)">◀</button>
      <button class="tl-btn" onclick="tlStep(1)">▶</button>
      <div class="tl-progress-wrap" id="tl-prog-wrap" onclick="tlSeek(event)"><div class="tl-progress-bar" id="tl-prog-bar"></div></div>
      <label class="tl-ctrl-label">speed <input type="range" id="tl-speed" min="1" max="10" value="5" oninput="tlSetSpeed(this.value)"><span id="tl-speed-val">×1</span></label>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <div class="lightbox-inner">
    <button class="lightbox-close" onclick="closeLightbox()">ESC / close</button>
    <img id="lb-img" src="" alt=""/>
    <div class="lightbox-meta" id="lb-meta"></div>
    <div class="lightbox-nav"><button id="lb-prev" onclick="lbNav(-1)">← prev</button><button id="lb-next" onclick="lbNav(+1)">next →</button></div>
  </div>
</div>

<footer>homelab ground station · images received directly from METEOR-M2 · decoded with SatDump</footer>

<script>
// ─── CONFIG: point these at your own n8n instance ──────────────────────────
const N8N_BASE = 'https://n8n.YOUR_DOMAIN';   // <-- replace
const NEXT_PASSES_API = N8N_BASE + '/webhook/next-passes';
const STATUS_API      = N8N_BASE + '/webhook/satdump-status';

function elClass(el){ if(el>=60)return 'high'; if(el>=30)return 'med'; return 'low'; }
function elLabel(el){ if(el>=60)return '★ excellent'; if(el>=30)return '◆ good'; return '◇ low'; }
function isProjected(n){ return n.startsWith('rgb_'); }
function needsFlip(n,p){ return !isProjected(n) && p.direction==='NtoS'; }

const gallery = document.getElementById('gallery');
let allImgs = [], lbIdx = 0;
const CHANNEL_LABELS = {
  'msu_mr_rgb_AVHRR_221_False_Color_corrected.png': 'False Color AVHRR 221',
  'msu_mr_rgb_AVHRR_3a21_False_Color_corrected.png': 'False Color AVHRR 3a21',
  'msu_mr_rgb_MSA_corrected.png': 'MSA',
  'rgb_msu_mr_rgb_AVHRR_3a21_False_Color_projected.png': 'False Color AVHRR 3a21 — projected',
  'rgb_msu_mr_rgb_MSA_projected.png': 'MSA — projected',
};
function shouldShow(n){ if(n.startsWith('rgb_'))return true; if(n.includes('_corrected')&&!n.includes('_map'))return true; return false; }
function getLabel(n){ return CHANNEL_LABELS[n] || n.replace(/_corrected/g,'').replace(/_/g,' ').replace('.png',''); }

function renderGallery(passes){
  passes.sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  allImgs=[]; gallery.innerHTML='';
  if(!passes.length){ gallery.innerHTML='<div style="padding:2rem;font-family:var(--mono);font-size:13px;color:var(--muted)">No passes recorded yet.</div>'; return; }
  const successful = passes.filter(p=>(p.imgs||[]).length>0);
  const failed = passes.filter(p=>(p.imgs||[]).length===0);
  successful.forEach((pass,pi)=>{
    const sec=document.createElement('div'); sec.className='pass'; sec.style.animationDelay=(pi*0.08)+'s';
    const sortedImgs=[...(pass.imgs||[])].sort((a,b)=>a.localeCompare(b));
    let imgsHTML='', visibleCount=0;
    sortedImgs.forEach(imgName=>{
      if(!shouldShow(imgName))return; visibleCount++;
      const src=`${pass.folder}/MSU-MR/${imgName}`, flip=needsFlip(imgName,pass), label=getLabel(imgName), globalIdx=allImgs.length;
      allImgs.push({src,label,pass,imgName});
      imgsHTML+=`<div class="thumb" onclick="openLightbox(${globalIdx})"><img src="${src}" alt="${label}" loading="lazy" style="${flip?'transform:scale(-1,-1)':''}"/>${flip?'<div class="thumb-flip-badge">↕ NtoS</div>':''}<div class="thumb-label">${label}</div><div class="thumb-overlay"><svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></div></div>`;
    });
    const dirBadge=pass.direction?`<span style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:4px">${pass.direction}</span>`:'';
    sec.innerHTML=`<div class="pass-header"><span class="pass-number">PASS #${passes.length-passes.indexOf(pass)}</span><span class="pass-date">${pass.date} · ${pass.time}</span>${pass.maxEl!=null?`<span class="pass-card-el ${elClass(pass.maxEl)}" style="margin-top:0;font-size:10px">${elLabel(pass.maxEl)}</span>`:''}${dirBadge}<span class="pass-meta">${pass.satellite} · ${visibleCount} image${visibleCount!==1?'s':''}${pass.maxEl!=null?` · ${Math.round(pass.maxEl)}° el`:''}${pass.frequency!=null?` · ${(pass.frequency/1e6).toFixed(3)} MHz`:''}${pass.gain!=null?` · ${pass.gain}dB gain`:''}</span></div><div class="pass-grid">${imgsHTML}</div>`;
    gallery.appendChild(sec);
  });
  if(failed.length){
    const acc=document.createElement('details'); acc.className='failed-accordion';
    let rows=''; failed.forEach(pass=>{ const d=[]; if(pass.maxEl!=null)d.push(`${Math.round(pass.maxEl)}° el`); if(pass.frequency!=null)d.push(`${(pass.frequency/1e6).toFixed(3)} MHz`); rows+=`<div class="failed-row"><span class="pass-date">${pass.date} · ${pass.time}</span><span class="pass-meta">${pass.satellite}</span><span class="pass-meta" style="margin-left:auto">${d.join(' · ')||'no metadata'}</span></div>`; });
    acc.innerHTML=`<summary><svg class="chevron" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg><span>${failed.length} pass${failed.length!==1?'es':''} with no signal</span><span class="count-badge">${failed.length}</span></summary><div class="failed-list">${rows}</div>`;
    gallery.appendChild(acc);
  }
}

fetch('passes.json?t='+Date.now()).then(r=>{if(!r.ok)throw new Error();return r.json();}).then(p=>{renderGallery(p);tlInit(p);}).catch(()=>{gallery.innerHTML='<div style="padding:2rem;font-family:var(--mono);font-size:13px;color:var(--muted)">No passes recorded yet.</div>';});

const lb=document.getElementById('lightbox'),lbImg=document.getElementById('lb-img'),lbMeta=document.getElementById('lb-meta'),lbPrev=document.getElementById('lb-prev'),lbNext=document.getElementById('lb-next');
function openLightbox(i){lbIdx=i;renderLb();lb.classList.add('open');}
function closeLightbox(e){if(e&&e.target!==lb)return;lb.classList.remove('open');}
function lbNav(d){lbIdx=Math.max(0,Math.min(allImgs.length-1,lbIdx+d));renderLb();}
function renderLb(){const it=allImgs[lbIdx];lbImg.src=it.src;lbImg.style.transform=needsFlip(it.imgName,it.pass)?'scale(-1,-1)':'';lbMeta.innerHTML=`<span>${it.label}</span> · ${it.pass.date} ${it.pass.time} · El. ${it.pass.maxEl} · ${it.pass.direction||''}`;lbPrev.disabled=lbIdx===0;lbNext.disabled=lbIdx===allImgs.length-1;}
document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')lb.classList.remove('open');if(e.key==='ArrowLeft')lbNav(-1);if(e.key==='ArrowRight')lbNav(1);});

// next-passes panel
(async function(){const grid=document.getElementById('next-passes-grid');
  function fmt(u){const d=new Date(u*1000);return{date:d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'Europe/Madrid'}),time:d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Madrid'})+' CEST'};}
  function cd(u){const diff=u-Date.now()/1000;if(diff<0)return'passing now';const h=Math.floor(diff/3600),m=Math.floor((diff%3600)/60);return h>0?`in ${h}h ${m}m`:`in ${m}m`;}
  try{const res=await fetch(NEXT_PASSES_API);const data=await res.json();const all=[];(Array.isArray(data)?data:[data]).forEach(s=>{const n=s.info?s.info.satname:'METEOR';(s.passes||[]).forEach(p=>all.push({...p,satname:n}));});all.sort((a,b)=>a.startUTC-b.startUTC);const passes=all.slice(0,3);
    if(!passes.length){grid.innerHTML='<div style="font-family:var(--mono);font-size:12px;color:var(--muted)">No passes ≥40° in next 5 days</div>';return;}
    grid.innerHTML=passes.map(p=>{const s=fmt(p.startUTC),mx=fmt(p.maxUTC),dur=Math.round((p.endUTC-p.startUTC)/60),ec=elClass(p.maxEl),night=p.isDaylight===false;return `<div class="pass-card${night?' skipped-night':''}"><div class="pass-card-date">${s.date} · <span style="color:var(--accent2)">${p.satname}</span></div><div class="pass-card-time">${s.time}</div><div class="pass-card-row"><span>peak</span><span>${mx.time}</span></div><div class="pass-card-row"><span>duration</span><span>${dur} min</span></div><div class="pass-card-row"><span>max elevation</span><span>${Math.round(p.maxEl)}°</span></div><div class="pass-card-el ${ec}">${elLabel(p.maxEl)}</div>${night?'<div class="pass-card-night-badge">🌙 night — skipped</div>':''}<div class="countdown">${cd(p.startUTC)}</div></div>`;}).join('');
  }catch(e){grid.innerHTML='<div style="font-family:var(--mono);font-size:12px;color:var(--muted)">Could not load pass predictions</div>';}
})();

// recording status
(async function poll(){const b=document.getElementById('sat-status-badge');try{const r=await fetch(STATUS_API);if(r.ok){const d=await r.json();const st=d.stdout.trim().split('\n').pop().trim();if(st==='running'){b.innerHTML='⏺ recording now';b.style.color='#ff4444';b.style.borderColor='#ff4444';b.style.animation='none';}else{b.textContent='not recording';}}}catch(e){}setTimeout(poll,10000);})();

// timelapse
const TL_IMG_NAME='msu_mr_rgb_AVHRR_221_False_Color_corrected.png',TL_BASE_MS=1000;
let tlFrames=[],tlIdx=0,tlTimer=null,tlSpeedX=5,tlRunning=false;
function tlInit(passes){tlFrames=passes.filter(p=>!p.exclude&&(p.imgs||[]).includes(TL_IMG_NAME)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(p=>({src:`${p.folder}/MSU-MR/${TL_IMG_NAME}`,date:p.date,time:p.time,direction:p.direction,barcelonaPx:p.barcelonaPx||null}));}
function openTimelapse(){if(!tlFrames.length)return;document.getElementById('tl-modal').classList.add('open');if(!tlRunning){tlRunning=true;tlRenderFrame();tlPlay();}}
function closeTimelapse(){document.getElementById('tl-modal').classList.remove('open');tlPause();tlRunning=false;}
function tlPlay(){if(tlTimer)clearInterval(tlTimer);tlTimer=setInterval(()=>{tlIdx=(tlIdx+1)%tlFrames.length;tlRenderFrame();},Math.round(TL_BASE_MS/tlSpeedX));document.getElementById('tl-pp').textContent='⏸';}
function tlPause(){clearInterval(tlTimer);tlTimer=null;document.getElementById('tl-pp').textContent='▶';}
function tlToggle(){if(tlTimer)tlPause();else tlPlay();}
function tlStep(d){tlPause();tlIdx=Math.max(0,Math.min(tlFrames.length-1,tlIdx+d));tlRenderFrame();}
function tlSetSpeed(v){tlSpeedX=parseInt(v);const l={1:'×0.2',2:'×0.4',3:'×0.6',4:'×0.8',5:'×1',6:'×1.5',7:'×2',8:'×3',9:'×5',10:'×10'};document.getElementById('tl-speed-val').textContent=l[tlSpeedX]||('×'+tlSpeedX);if(tlTimer)tlPlay();}
function tlSeek(e){const w=document.getElementById('tl-prog-wrap');tlIdx=Math.round(Math.max(0,Math.min(1,e.offsetX/w.clientWidth))*(tlFrames.length-1));tlRenderFrame();}
function tlRenderFrame(){if(!tlFrames.length)return;const f=tlFrames[tlIdx];document.getElementById('tl-ts').textContent=`${f.date} · ${f.time}`;document.getElementById('tl-counter').textContent=`${tlIdx+1} / ${tlFrames.length}`;document.getElementById('tl-prog-bar').style.width=(tlFrames.length>1?(tlIdx/(tlFrames.length-1))*100:0)+'%';const img=document.getElementById('tl-img'),vp=document.getElementById('tl-viewport'),c=document.getElementById('tl-center-bcn').checked;img.onload=function(){tlPositionImg(f,img,vp,c);};img.src=f.src;if(img.complete&&img.naturalWidth>0)tlPositionImg(f,img,vp,c);if(tlIdx+1<tlFrames.length){const p=new Image();p.src=tlFrames[tlIdx+1].src;}}
function tlPositionImg(f,img,vp,center){const vpW=vp.clientWidth,vpH=vp.clientHeight,iw=img.naturalWidth,ih=img.naturalHeight;if(!iw||!ih)return;const sc=Math.min(vpW/iw,vpH/ih),dw=iw*sc,dh=ih*sc,flip=f.direction==='NtoS';img.style.width=dw+'px';img.style.height=dh+'px';img.style.transform=flip?'scale(-1,-1)':'';if(center&&f.barcelonaPx){const bx=f.barcelonaPx.col*sc,by=f.barcelonaPx.row*sc;let left,top;if(flip){left=vpW/2-dw+bx;top=vpH/2-dh+by;}else{left=vpW/2-bx;top=vpH/2-by;}img.style.left=left+'px';img.style.top=top+'px';}else{img.style.left=((vpW-dw)/2)+'px';img.style.top=((vpH-dh)/2)+'px';}}
document.addEventListener('keydown',e=>{const m=document.getElementById('tl-modal');if(!m.classList.contains('open'))return;if(e.key==='Escape')closeTimelapse();else if(e.key===' '){e.preventDefault();tlToggle();}else if(e.key==='ArrowLeft')tlStep(-1);else if(e.key==='ArrowRight')tlStep(1);});
</script>

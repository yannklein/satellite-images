<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ELEKTRO-L3 full-disk movie — yannklein.dev</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%8D%3C/text%3E%3C/svg%3E"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <!--
    Standalone ELEKTRO-L3 movie. Also shown inside index.html's popup as an
    iframe with ?embed=1 (adds the "open as page" link + close button, which
    calls back into the parent). URL params: ch=<channel key>, borders=1 (off by default),
    seq=1530 (one frame per day at 15:30 UTC instead of every 3 h),
    from=YYYY-MM-DD[THH:MM] (first frame, UTC; default MOVIE_START).
  -->
  <style>
    :root {
      --bg: #080c10; --surface: #0d1117; --card: #111820;
      --border: rgba(255,255,255,0.07);
      --accent: #00e5a0; --accent2: #0088ff;
      --text: #e8edf2; --muted: #5a6878;
      --mono: 'Space Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--mono); background: var(--surface); color: var(--text);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .topbar {
      display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 10px 14px; border-bottom: 0.5px solid var(--border); flex-shrink: 0;
      font-size: 12px; color: var(--muted);
    }
    .topbar strong { color: var(--accent); font-weight: 700; }
    .topbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    select {
      font-family: var(--mono); font-size: 11px; background: var(--card); color: var(--text);
      border: 0.5px solid var(--border); border-radius: 4px; padding: 3px 6px; cursor: pointer;
    }
    select:hover { border-color: var(--accent); }
    .lbl { font-size: 11px; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 5px; }
    .lbl.disabled { opacity: 0.4; }
    .lbl input[type=range] { width: 70px; }
    .lbl input[type=checkbox] { cursor: pointer; }
    .link-btn, .close-btn {
      font-family: var(--mono); font-size: 11px; background: none; text-decoration: none;
      border: 0.5px solid var(--border); color: var(--muted);
      padding: 3px 10px; border-radius: 4px; cursor: pointer;
    }
    .link-btn { color: var(--accent2); border-color: rgba(0,136,255,0.4); }
    .link-btn:hover { background: rgba(0,136,255,0.12); }
    .close-btn:hover { color: var(--text); border-color: var(--text); }
    body:not(.embed) .embed-only { display: none; }
    .viewport { flex: 1; position: relative; overflow: hidden; background: #000; }
    .viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .empty {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: var(--muted);
    }
    .controls {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 8px 14px; border-top: 0.5px solid var(--border);
      background: var(--card); flex-shrink: 0;
    }
    .btn {
      font-family: var(--mono); font-size: 13px; background: none;
      border: 0.5px solid var(--border); color: var(--text);
      width: 32px; height: 32px; border-radius: 4px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .prog-wrap {
      flex: 1; height: 6px; background: rgba(255,255,255,0.1); position: relative;
      border-radius: 3px; cursor: pointer; min-width: 60px;
    }
    .prog-bar { height: 100%; background: var(--accent); border-radius: 3px; width: 0%; }
    /* Progress is proportional to real time; spans with no usable data are hatched. */
    .prog-gap {
      position: absolute; top: -2px; bottom: -2px; pointer-events: none;
      background: repeating-linear-gradient(135deg, rgba(255,107,107,0.55) 0 3px, transparent 3px 6px);
    }
    .gap-badge {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      font-size: 11px; color: #ffb3b3; background: rgba(40,10,10,0.75);
      border: 0.5px solid rgba(255,107,107,0.5); border-radius: 4px; padding: 4px 10px;
      opacity: 0; transition: opacity 0.25s; pointer-events: none; white-space: nowrap;
    }
    .gap-badge.show { opacity: 1; }
    .legend {
      position: absolute; left: 12px; bottom: 10px; font-size: 10px; color: rgba(200,210,225,0.6);
      pointer-events: none; text-shadow: 0 0 3px #000;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div>
      ELEKTRO-L3 movie &nbsp;·&nbsp; <strong id="ts">—</strong>
      <span id="counter" style="margin-left:8px"></span>
    </div>
    <div class="topbar-right">
      <label class="lbl">channel <select id="channel" onchange="setChannel(this.value)"></select></label>
      <label class="lbl">frames <select id="seq" onchange="setSeq(this.value)"></select></label>
      <label class="lbl" id="borders-lbl">
        <input type="checkbox" id="borders" autocomplete="off" onchange="onBordersChange()"> borders
      </label>
      <a class="link-btn embed-only" id="page-link" href="elektro-movie.html" target="_blank" rel="noopener">↗ open as page</a>
      <button class="close-btn embed-only" onclick="closeEmbed()">× close</button>
    </div>
  </div>
  <div class="viewport" id="viewport">
    <canvas id="cv"></canvas>
    <div class="empty" id="empty" style="display:none">no frames for this channel</div>
    <div class="gap-badge" id="gap-badge"></div>
    <div class="legend" id="legend" hidden>night side: this pass's real 10.7µm IR clouds (no static map)</div>
  </div>
  <div class="controls">
    <button class="btn" id="pp" onclick="toggle()" title="play/pause (space)">⏸</button>
    <button class="btn" onclick="step(-1)" title="prev (←)">◀</button>
    <button class="btn" onclick="step(1)"  title="next (→)">▶</button>
    <div class="prog-wrap" id="prog-wrap" onclick="seek(event)" title="timeline · hatched = no usable data"><div class="prog-bar" id="prog-bar"></div><div id="prog-gaps"></div></div>
    <label class="lbl" title="time per 3-hour step (one day ≈ 8 frames)">
      frame <input type="range" id="speed" autocomplete="off" min="0.2" max="3" step="0.05" value="0.5" oninput="setSpeed(this.value)">
      <span id="speed-val">0.50s</span>
    </label>
    <label class="lbl" title="share of each frame spent dissolving into the next; 100% = continuous motion">
      blend <input type="range" id="blend" autocomplete="off" min="0" max="100" step="5" value="100" oninput="setBlend(this.value)">
      <span id="blend-val">100%</span>
    </label>
  </div>

<script>
// Each channel plays the 900px preview JPGs rebuild-elektro.sh makes (~100-300 KB)
// rather than the 2784px PNGs (~2-5 MB each). `img` is the file a slot must
// have for the channel to include it; `preview` maps a slot to its JPG.
const RAW = n => s => s.imgs.find(i => new RegExp(`^L3_${n}_`).test(i));
const CHANNELS = [
  { key: 'natural', label: 'Natural color',            img: s => s.imgs.includes('natural_color.png') && 'natural_color.png',
    preview: (s, borders) => borders && s.imgs.includes('natural_color_borders.png')
               ? 'natural_color_borders.jpg' : 'natural_color.jpg', borders: true },
  { key: 'ir4',  label: 'IR 3.8µm enhanced',  img: s => s.imgs.includes('ir_ch4_enhanced_borders.png') && 'x', preview: () => 'ir_ch4_enhanced_borders.jpg' },
  { key: 'ir9',  label: 'IR 10.7µm enhanced', img: s => s.imgs.includes('ir_ch9_enhanced_borders.png') && 'x', preview: () => 'ir_ch9_enhanced_borders.jpg' },
  { key: 'ch1',  label: 'Ch 1 · 0.5–0.65µm (raw)', img: RAW(1), preview: () => 'L3_1.jpg' },
  { key: 'ch2',  label: 'Ch 2 · 0.65–0.8µm (raw)', img: RAW(2), preview: () => 'L3_2.jpg' },
  { key: 'ch3',  label: 'Ch 3 · 0.8–0.9µm (raw)',  img: RAW(3), preview: () => 'L3_3.jpg' },
  { key: 'ch4',  label: 'Ch 4 · 3.5–4.0µm (raw)',  img: RAW(4), preview: () => 'L3_4.jpg' },
  { key: 'ch9',  label: 'Ch 9 · 10.2–11.2µm (raw)', img: RAW(9), preview: () => 'L3_9.jpg' },
];
// Frame sequences. `stepH` is the nominal spacing: playback holds each frame in
// proportion to its real time step (up to 2x); anything longer than 2 steps is a
// gap — faded through black with a "+N later" badge instead of a silent jump.
const SEQS = {
  all:  { label: 'every 3 h',       stepH: 3,  keep: () => true },
  1530: { label: 'daily 15:30 UTC', stepH: 24, keep: s => s.time === '15:30' },
};
// Playback is a continuous dissolve drawn on a canvas every animation frame:
// during each frame's time slot the next image fades in *linearly* over the
// current one (which stays fully opaque underneath — no brightness dip). With
// blend = 100% the picture is always mid-dissolve, so the 3-hourly stills read as
// continuous motion. Defaults: 0.5 s per 3-hour step (a day ≈ 4 s), blend 100%.
const DEFAULT_FRAME_S = 0.5, DEFAULT_BLEND = 100;

const params = new URLSearchParams(location.search);
const embed  = params.has('embed');
if (embed) document.body.classList.add('embed');

let slots   = [];
let channel = CHANNELS.find(c => c.key === params.get('ch')) || CHANNELS[0];
let seq     = SEQS[params.get('seq')] ? params.get('seq') : 'all';
let frames  = [];
let idx     = 0;
let playing = false;
let frameMs = DEFAULT_FRAME_S * 1000;
let blend   = DEFAULT_BLEND / 100;
let segStart = 0;     // performance.now() when the current frame's slot began
let dirty   = true;   // redraw needed while paused
let lastJSON = null;
const $ = id => document.getElementById(id);
// Set controls explicitly: browsers restore form state on reload, which would
// otherwise override these defaults (borders off, 0.5 s per frame, blend 100%).
$('borders').checked = params.get('borders') === '1';
$('speed').value = DEFAULT_FRAME_S; setSpeed(DEFAULT_FRAME_S);
$('blend').value = DEFAULT_BLEND; setBlend(DEFAULT_BLEND);

function buildFrames() {
  const prevKey = frames[idx] && frames[idx].key;
  const borders = $('borders').checked;
  const stepMs = SEQS[seq].stepH * 3600e3;
  frames = slots
    .filter(s => usable(s) && channel.img(s))
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))
    .map(s => ({
      key: s.id, date: s.date, time: s.time, t: Date.parse(`${s.date}T${s.time}:00Z`),
      src: `${s.folder}/preview/${channel.preview(s, borders)}${s.rev ? `?v=${s.rev}` : ''}`,
    }));
  frames.forEach((f, i) => {
    const dt = i ? f.t - frames[i - 1].t : 0;
    f.gapBefore = dt > 2 * stepMs ? dt : 0;
  });
  drawGaps();
  // Keep the same moment in time across channel switches and live refreshes.
  const keep = frames.findIndex(f => f.key === prevKey);
  idx = keep >= 0 ? keep : Math.min(idx, Math.max(0, frames.length - 1));
}

// The movie starts here ("YYYY-MM-DD HH:MM" UTC): before it captures were too
// sparse (multi-day gaps, many poor slots) to play as a movie; from it on there are
// no gaps. Keep in sync with index.html.
const fromParam = (params.get('from') || '').replace('T', ' ');
const MOVIE_START = /^\d{4}-\d\d-\d\d( \d\d:\d\d)?$/.test(fromParam) ? fromParam : '2026-11-14 18:30';
const usable = s => s.quality !== 'poor' && `${s.date} ${s.time}` >= MOVIE_START && SEQS[seq].keep(s);

function fmtDur(ms) {
  const h = Math.round(ms / 3600e3), d = Math.floor(h / 24);
  return d ? `${d} d${h % 24 ? ` ${h % 24} h` : ''}` : `${h} h`;
}
const timeFrac = t => {
  const t0 = frames[0].t, span = frames[frames.length - 1].t - t0;
  return span ? (t - t0) / span : 0;
};
function drawGaps() {
  const el = $('prog-gaps');
  el.innerHTML = '';
  frames.forEach((f, i) => {
    if (!f.gapBefore) return;
    const a = timeFrac(frames[i - 1].t), b = timeFrac(f.t);
    const d = document.createElement('div');
    d.className = 'prog-gap';
    Object.assign(d.style, { left: a * 100 + '%', width: (b - a) * 100 + '%' });
    el.appendChild(d);
  });
}

function renderSeqSelect() {
  $('seq').innerHTML = Object.entries(SEQS).map(([k, v]) =>
    `<option value="${k}"${k === seq ? ' selected' : ''}>${v.label}</option>`).join('');
}
function setSeq(k) {
  seq = SEQS[k] ? k : 'all';
  renderChannelSelect(); buildFrames(); syncUrl(); render();
}

function renderChannelSelect() {
  // Only offer channels that have at least one usable frame.
  const sel = $('channel');
  const avail = CHANNELS.filter(c => slots.some(s => usable(s) && c.img(s)));
  sel.innerHTML = avail.map(c => {
    const n = slots.filter(s => usable(s) && c.img(s)).length;
    return `<option value="${c.key}"${c === channel ? ' selected' : ''}>${c.label} (${n})</option>`;
  }).join('');
  if (!avail.includes(channel) && avail.length) { channel = avail[0]; sel.value = channel.key; }
}

function syncUrl() {
  const p = new URLSearchParams();
  if (channel.key !== CHANNELS[0].key) p.set('ch', channel.key);
  if (seq !== 'all') p.set('seq', seq);
  if (channel.borders && $('borders').checked) p.set('borders', '1');
  const qs = p.toString();
  $('page-link').href = 'elektro-movie.html' + (qs ? '?' + qs : '');
  if (!embed) history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
  $('borders-lbl').classList.toggle('disabled', !channel.borders);
  $('borders').disabled = !channel.borders;
  $('legend').hidden = channel.key !== 'natural';
}

function setChannel(key) {
  channel = CHANNELS.find(c => c.key === key) || CHANNELS[0];
  buildFrames(); syncUrl(); render();
}
function onBordersChange() { buildFrames(); syncUrl(); render(); }

// How long frame i's slot lasts: proportional to the real time until the next frame
// (1x for a nominal step, up to 2x for one missing frame); a gap gets 1x, since it's
// shown as a cut instead. The last frame lingers before the loop restarts.
function holdMs(i) {
  const f = frames[i], n = frames[i + 1];
  if (!n) return frameMs * 2.5;
  if (n.gapBefore) return frameMs;
  return frameMs * Math.min(2, Math.max(1, (n.t - f.t) / (SEQS[seq].stepH * 3600e3)));
}
function play() {
  playing = true; segStart = performance.now();
  $('pp').textContent = '⏸';
}
function pause() { playing = false; dirty = true; $('pp').textContent = '▶'; }
function toggle() { playing ? pause() : play(); }
function step(d) {
  if (!frames.length) return;
  pause(); idx = (idx + d + frames.length) % frames.length; render();
}
function setSpeed(v) {
  const now = performance.now(), p = frames.length ? (now - segStart) / holdMs(idx) : 0;
  frameMs = parseFloat(v) * 1000;
  if (frames.length) segStart = now - p * holdMs(idx);   // keep the dissolve where it is
  $('speed-val').textContent = parseFloat(v).toFixed(2) + 's';
}
function setBlend(v) {
  blend = parseInt(v) / 100;
  $('blend-val').textContent = v + '%';
  dirty = true;
}
function seek(e) {
  if (!frames.length) return;
  // The bar is a timeline: jump to the frame nearest the clicked moment.
  const frac = Math.max(0, Math.min(1, e.offsetX / $('prog-wrap').clientWidth));
  const t = frames[0].t + frac * (frames[frames.length - 1].t - frames[0].t);
  idx = frames.reduce((best, f, i) => Math.abs(f.t - t) < Math.abs(frames[best].t - t) ? i : best, 0);
  render();
}

// Decoded-image cache. Every frame of the sequence is requested up front, nearest
// first, so playback never waits on the network mid-loop; if the next image still
// isn't ready the clock holds (buffering) instead of stuttering.
const cache = new Map();
function getImg(src) {
  let im = cache.get(src);
  if (!im) {
    im = new Image();
    im.ready = false;
    im.src = src;
    im.decode().catch(() => {}).finally(() => { im.ready = true; dirty = true; });
    cache.set(src, im);
  }
  return im;
}
function preload() {
  for (let i = 0; i < frames.length; i++) getImg(frames[(idx + i) % frames.length].src);
}

const cv = $('cv'), ctx = cv.getContext('2d');
new ResizeObserver(() => {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(cv.clientWidth * dpr); cv.height = Math.round(cv.clientHeight * dpr);
  dirty = true;
}).observe($('viewport'));

function drawImg(im, alpha) {
  if (alpha <= 0 || !im.ready || !im.naturalWidth) return;
  const k = Math.min(cv.width / im.naturalWidth, cv.height / im.naturalHeight);
  const w = im.naturalWidth * k, h = im.naturalHeight * k;
  ctx.globalAlpha = Math.min(1, alpha);
  ctx.drawImage(im, (cv.width - w) / 2, (cv.height - h) / 2, w, h);
}

let shownKey = null;
function showInfo(f) {
  if (f.key === shownKey) return;
  shownKey = f.key;
  $('ts').textContent = `${f.date} · ${f.time} UTC`;
  $('counter').textContent = `${frames.indexOf(f) + 1} / ${frames.length}`;
  const badge = $('gap-badge');
  if (f.gapBefore) badge.textContent = `⏭ ${fmtDur(f.gapBefore)} later · no usable data in between`;
  badge.classList.toggle('show', !!f.gapBefore);
}

function draw(now) {
  requestAnimationFrame(draw);
  if (!frames.length) return;
  if (idx >= frames.length) idx = 0;
  let base = frames[idx], nIdx = (idx + 1) % frames.length, target = frames[nIdx];
  let p = 0;
  if (playing && frames.length > 1) {
    if (!getImg(base.src).ready || !getImg(target.src).ready) segStart = now;   // buffering
    let dur = holdMs(idx);
    if (now - segStart >= dur) {
      idx = nIdx; segStart = now - segStart - dur > 250 ? now : segStart + dur;  // no drift; resync after a stall
      base = frames[idx]; nIdx = (idx + 1) % frames.length; target = frames[nIdx];
      dur = holdMs(idx);
    }
    p = Math.min(1, (now - segStart) / dur);
  } else if (!dirty) return;
  dirty = false;

  // q: dissolve progress over the last `blend` share of the slot (linear).
  const q = blend > 0 ? Math.max(0, Math.min(1, (p - (1 - blend)) / blend)) : 0;
  // Across a data gap or the loop restart, fade through black instead.
  const cut = !!target.gapBefore || nIdx === 0;
  ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (cut) { drawImg(getImg(base.src), 1 - 2 * q); drawImg(getImg(target.src), 2 * q - 1); }
  else     { drawImg(getImg(base.src), 1);         drawImg(getImg(target.src), q); }

  showInfo(q >= 0.5 ? target : base);
  // Continuous timeline position (snaps back at the loop restart).
  const t = nIdx === 0 ? base.t : base.t + (target.t - base.t) * q;
  $('prog-bar').style.width = timeFrac(t) * 100 + '%';
}
requestAnimationFrame(draw);

function render() {
  $('empty').style.display = frames.length ? 'none' : 'flex';
  shownKey = null; dirty = true;
  if (!frames.length) {
    ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
    $('ts').textContent = '—'; $('counter').textContent = ''; $('gap-badge').classList.remove('show'); return;
  }
  segStart = performance.now();
  preload();
}

function closeEmbed() {
  if (embed && parent !== window && parent.closeElektroMovie) parent.closeElektroMovie();
}

function load(first) {
  return fetch('elektro.json?t=' + Date.now()).then(r => r.json()).then(data => {
    const txt = JSON.stringify(data);
    if (txt === lastJSON) return;
    lastJSON = txt;
    slots = data;
    renderSeqSelect();
    renderChannelSelect();
    buildFrames();
    syncUrl();
    if (first) { idx = 0; render(); play(); }
  });
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'Escape') closeEmbed();
  else if (e.key === ' ') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowLeft')  step(-1);
  else if (e.key === 'ArrowRight') step(1);
});

load(true).catch(() => { $('empty').textContent = 'could not load elektro.json'; $('empty').style.display = 'flex'; });
// Pick up slots n8n processes while the page is open (same cadence as index.html).
setInterval(() => { if (!document.hidden) load(false).catch(() => {}); }, 2 * 60 * 1000);
</script>
</body>
</html>
